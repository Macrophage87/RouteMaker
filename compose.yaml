# One stack on one host, per the plan's Deployment section.
#
# Two rules this file exists to enforce, both asserted in CI rather than trusted
# to review:
#
# 1. Only Caddy publishes a port. Photon, Valhalla, the renderer and the bot are
#    reachable only from inside this network; the bot in particular is the source
#    of authorization truth and must never be addressable from outside.
# 2. Every service declares both a memory and a CPU limit. The memory limits keep
#    the peak inside host RAM including the duplicate Valhalla containers that
#    exist during a swap; the CPU limit on the rebuild is what stops a six-hour
#    build from saturating every core and destroying the latency target.
#
# Secrets are scoped per service rather than handed to every container by a
# shared env_file, which would put the key-encryption key in Photon and Valhalla
# and contradict the claim that one component alone holds the bot token.

x-restart: &restart
  restart: unless-stopped

# Everything `config/settings.py` reads from the environment that is not a
# secret and that every Django process needs the same value of. The four
# services that import Django settings - api, worker, migrate and rebuild - all
# merge this; the secrets stay written out per service below, because which
# container holds which secret is the thing the scoping rule exists to make
# readable at a glance.
#
# This block used to not exist and neither did most of its contents. Six
# variables were declared against the twenty-four settings.py reads, so
# ALLOWED_HOSTS was the module's own "localhost" default and every request
# arriving through Caddy was a DisallowedHost 400; the authorize URL carried an
# empty client_id and a localhost redirect; and the database host was the
# 127.0.0.1 default rather than the compose service. tests/test_compose.py
# derives the set of names from settings.py's source and fails until each one is
# either declared here or named in that test's allow-list.
#
# Defaults are repeated from settings.py only where an unset variable would
# otherwise reach it as the empty string (`int("")` raises at import) or where
# settings.py's own default is wrong inside a container - PGHOST, whose default
# 127.0.0.1 is this container rather than the database.
x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: config.settings
  DJANGO_DEBUG: ${DJANGO_DEBUG:-}
  PGHOST: ${PGHOST:-postgis}
  PGPORT: ${PGPORT:-5432}
  PGDATABASE: ${PGDATABASE:-routemaker}
  PGUSER: ${PGUSER:-routemaker}
  DJANGO_CONN_MAX_AGE: ${DJANGO_CONN_MAX_AGE:-60}

services:
  caddy:
    <<: *restart
    image: caddy:2.8-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ${DATA_ROOT}/caddy:/data
      - ${DATA_ROOT}/static:/srv/static:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.5" }

  api:
    <<: *restart
    image: routemaker/api:${TAG}
    environment:
      <<: *django-env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY}
      PGPASSWORD: ${PGPASSWORD}
      # The host and origin settings. Both have defaults in settings.py that are
      # correct for a checkout and wrong for this stack: ALLOWED_HOSTS falls back
      # to "localhost", which behind Caddy makes every request a DisallowedHost
      # 400, and CSRF_TRUSTED_ORIGINS falls back to empty, which refuses every
      # POST that arrives over the proxy's HTTPS. Required, with no compose
      # default, because there is no value that is right for two deployments.
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
      DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:-internal-8f3a/}
      # Discord sign-in, identify scope only. The client id and the redirect are
      # not secrets - they are in every authorize URL - but without them the URL
      # this service builds names an empty application and sends the browser back
      # to localhost, so the login path does not work at all. The secret is used
      # once per login to exchange a code and is read by this service alone.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      # The one bootstrap Discord id. It grants standing only while the
      # instance-admin list is empty, and the first admin request under it
      # writes the id into the list and disables this path for good. The admin
      # is the only surface that reads it, so it goes to this service alone.
      BOOTSTRAP_INSTANCE_ADMIN_DISCORD_ID: ${BOOTSTRAP_INSTANCE_ADMIN_DISCORD_ID:-}
      # The removal window. Read where a removal is scheduled, which is the
      # admin, which is this service.
      INSTANCE_ADMIN_REMOVAL_DELAY_SECONDS: ${INSTANCE_ADMIN_REMOVAL_DELAY_SECONDS:-3600}
      # Where the routing client finds each variant. The swap repoints the
      # ValhallaUpstream rows; these are the values a row is seeded from, so the
      # API and the rebuild that writes those rows must agree on them.
      VALHALLA_STANDARD_URL: ${VALHALLA_STANDARD_URL:-http://valhalla-standard:8002}
      VALHALLA_NO_TRAIL_URL: ${VALHALLA_NO_TRAIL_URL:-http://valhalla-no-trail:8002}
      VALHALLA_EBIKE_URL: ${VALHALLA_EBIKE_URL:-http://valhalla-ebike:8002}
    depends_on:
      postgis: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { memory: 2G, cpus: "2" }

  # The worker runs under manage.py so Django is set up before a task runs, and
  # its schema arrives through the migrate one-shot below like every other
  # table. The bare `procrastinate --app=... worker` this replaced died on a
  # missing schema function and, with the schema applied by hand, every task
  # raised AppRegistryNotReady. The queue list is explicit: the rebuild queue
  # belongs to the rebuild service, which is the container with the Valhalla
  # binaries and the data mounts.
  worker:
    <<: *restart
    image: routemaker/api:${TAG}
    # Four slots, not the default one: every periodic task except the rebuild
    # queues here, and Procrastinate drops a periodic tick whose predecessor is
    # still running rather than delaying it. With one slot a nightly dump held
    # the queue and the 5-minute degraded sweep and 10-minute worker heartbeat
    # silently missed their ticks (docs/OPERATIONS.md, "The maintenance queue").
    command: ["./manage.py", "procrastinate", "worker", "--queues=maintenance", "--concurrency=4"]
    environment:
      <<: *django-env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY}
      PGPASSWORD: ${PGPASSWORD}
      # settings.BACKUP_DIR is DATA_ROOT/backups, and the only mount this
      # service has is the backups directory at /data/backups. Without this the
      # nightly dump resolved BACKUP_DIR against the module's default - a `data`
      # directory inside the image - and wrote every dump to container storage
      # that the next restart discards.
      DATA_ROOT: /data
    volumes:
      - ${DATA_ROOT}/backups:/data/backups
    depends_on:
      postgis: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { memory: 2G, cpus: "2" }

  # Applies every migration, the worker's job tables included: procrastinate's
  # Django integration ships its schema as migrations, so this one step both
  # creates the schema on a fresh box and upgrades it on an existing one.
  migrate:
    image: routemaker/api:${TAG}
    command: ["./manage.py", "migrate", "--noinput"]
    restart: "no"
    environment:
      <<: *django-env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      # Every process that imports settings needs this: the ban tombstone's
      # HMAC key is derived from it and there is deliberately no default, so a
      # container without it fails at import rather than keying tombstones with
      # a value from the repository. That is why it reaches the two services
      # that only ever run migrations and the rebuild, neither of which
      # computes a tombstone.
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY}
      PGPASSWORD: ${PGPASSWORD}
    depends_on: [postgis]
    deploy:
      resources:
        limits: { memory: 256M, cpus: "1" }

  postgis:
    <<: *restart
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: routemaker
      POSTGRES_USER: routemaker
      POSTGRES_PASSWORD: ${PGPASSWORD}
    volumes: ["${DATA_ROOT}/postgres:/var/lib/postgresql/data"]
    deploy:
      resources:
        limits: { memory: 4G, cpus: "4" }

  photon:
    <<: *restart
    image: rtuszik/photon-docker:latest
    volumes: ["${DATA_ROOT}/photon:/photon/photon_data"]
    deploy:
      resources:
        limits: { memory: 3G, cpus: "2" }

  # One process per tile variant. Worker counts are explicit because the layer 4
  # candidate set is issued concurrently under a per-modality latency bound, and
  # a single thor worker would serialise it.
  valhalla-standard:
    <<: *restart
    image: ghcr.io/valhalla/valhalla:3.5.1
    # The upstream image declares neither ENTRYPOINT nor CMD - it is a toolbox,
    # not a service image - so it inherits the base image's shell and exits
    # immediately. With `restart: unless-stopped` that is a container that
    # restarts forever while answering nothing, which is what an env var named
    # VALHALLA_CONFIG bought: the image reads no such variable.
    #
    # The second argument is the worker count per stage. valhalla_service takes
    # it from argv and otherwise uses hardware_concurrency, which on this host
    # would start one worker per core of the whole machine inside a two-core
    # limit. It is not a configuration key; the loki_workers, thor_workers and
    # odin_workers keys the configs used to carry are read by nothing.
    command: ["valhalla_service", "/conf/valhalla-standard.json", "2"]
    # The served build, at the path the config names. `current` is a symlink
    # the rebuild replaces at promotion; the container loads whatever it
    # points at when it starts, and is restarted after a swap to load the
    # next one. The same path resolves to the same file inside the rebuild
    # container, which mounts the whole data volume.
    volumes:
      - ${DATA_ROOT}/tiles/standard/current:/data/tiles/standard/current:ro
      - ${DATA_ROOT}/elevation:/data/elevation:ro
      - ./valhalla:/conf:ro
      - ./lua:/conf/lua:ro
    deploy:
      resources:
        limits: { memory: 2G, cpus: "2" }

  valhalla-no-trail:
    <<: *restart
    image: ghcr.io/valhalla/valhalla:3.5.1
    # The upstream image declares neither ENTRYPOINT nor CMD - it is a toolbox,
    # not a service image - so it inherits the base image's shell and exits
    # immediately. With `restart: unless-stopped` that is a container that
    # restarts forever while answering nothing, which is what an env var named
    # VALHALLA_CONFIG bought: the image reads no such variable.
    #
    # The second argument is the worker count per stage. valhalla_service takes
    # it from argv and otherwise uses hardware_concurrency, which on this host
    # would start one worker per core of the whole machine inside a two-core
    # limit. It is not a configuration key; the loki_workers, thor_workers and
    # odin_workers keys the configs used to carry are read by nothing.
    command: ["valhalla_service", "/conf/valhalla-no-trail.json", "2"]
    # The served build, at the path the config names. `current` is a symlink
    # the rebuild replaces at promotion; the container loads whatever it
    # points at when it starts, and is restarted after a swap to load the
    # next one. The same path resolves to the same file inside the rebuild
    # container, which mounts the whole data volume.
    volumes:
      - ${DATA_ROOT}/tiles/no-trail/current:/data/tiles/no-trail/current:ro
      - ${DATA_ROOT}/elevation:/data/elevation:ro
      - ./valhalla:/conf:ro
      - ./lua:/conf/lua:ro
    deploy:
      resources:
        limits: { memory: 2G, cpus: "2" }

  valhalla-ebike:
    <<: *restart
    image: ghcr.io/valhalla/valhalla:3.5.1
    # The upstream image declares neither ENTRYPOINT nor CMD - it is a toolbox,
    # not a service image - so it inherits the base image's shell and exits
    # immediately. With `restart: unless-stopped` that is a container that
    # restarts forever while answering nothing, which is what an env var named
    # VALHALLA_CONFIG bought: the image reads no such variable.
    #
    # The second argument is the worker count per stage. valhalla_service takes
    # it from argv and otherwise uses hardware_concurrency, which on this host
    # would start one worker per core of the whole machine inside a two-core
    # limit. It is not a configuration key; the loki_workers, thor_workers and
    # odin_workers keys the configs used to carry are read by nothing.
    command: ["valhalla_service", "/conf/valhalla-ebike.json", "2"]
    # The served build, at the path the config names. `current` is a symlink
    # the rebuild replaces at promotion; the container loads whatever it
    # points at when it starts, and is restarted after a swap to load the
    # next one. The same path resolves to the same file inside the rebuild
    # container, which mounts the whole data volume.
    volumes:
      - ${DATA_ROOT}/tiles/ebike/current:/data/tiles/ebike/current:ro
      - ${DATA_ROOT}/elevation:/data/elevation:ro
      - ./valhalla:/conf:ro
      - ./lua:/conf/lua:ro
    deploy:
      resources:
        limits: { memory: 2G, cpus: "2" }

  renderer:
    <<: *restart
    image: routemaker/renderer:${TAG}
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1" }

  # The only component that holds the bot token, and the source of authorization
  # truth. Exposes its membership interface on the internal network behind a
  # shared secret, read-only.
  bot:
    <<: *restart
    image: routemaker/bot:${TAG}
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET}
      PGPASSWORD: ${PGPASSWORD}
    depends_on: [postgis]
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1" }

  # The weekly rebuild's executor: a worker on the rebuild queue alone, in the
  # image that carries the Valhalla and GDAL binaries. The scheduling is
  # Procrastinate's (the periodic task is registered in every worker and the
  # deferral is deduplicated in the database), the execution is here, because
  # this is the container with the binaries, the mounts and the limits. Takes
  # half the cores.
  #
  # It mounts the whole data volume at /data, so DATA_ROOT inside it is /data
  # and every path the generated Valhalla configs name - the tile directories
  # under /data/tiles, the elevation cache at /data/elevation - resolves to the
  # same host file the serving containers mount. The earlier version mounted
  # /tiles and /extracts, neither of which any configured path named, so tiles
  # landed on ephemeral container storage and vanished with it.
  #
  # Phase 1 validates a build by reading it back with valhalla_service in
  # one-shot mode inside this container; it starts no duplicate serving
  # containers, so this service is the only extra memory resident at swap
  # time. When blue/green validation containers arrive, this worker has to be
  # out of the way for the plan's swap-time arithmetic to hold - see
  # scripts/check_compose_limits.py, which asserts both figures.
  rebuild:
    <<: *restart
    image: routemaker/pipeline:${TAG}
    command: ["./manage.py", "procrastinate", "worker", "--queues=rebuild", "--concurrency=1"]
    environment:
      <<: *django-env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY}
      PGPASSWORD: ${PGPASSWORD}
      DATA_ROOT: /data
      # The disk gate: a rebuild refuses to start unless a second full tile set
      # fits beside the current one. This is the only service that reads it.
      REBUILD_MIN_FREE_BYTES: ${REBUILD_MIN_FREE_BYTES:-21474836480}
      # The rebuild writes the ValhallaUpstream rows at the swap, seeding any
      # row that does not exist yet from these.
      VALHALLA_STANDARD_URL: ${VALHALLA_STANDARD_URL:-http://valhalla-standard:8002}
      VALHALLA_NO_TRAIL_URL: ${VALHALLA_NO_TRAIL_URL:-http://valhalla-no-trail:8002}
      VALHALLA_EBIKE_URL: ${VALHALLA_EBIKE_URL:-http://valhalla-ebike:8002}
    volumes:
      - ${DATA_ROOT}:/data
      - ./valhalla:/conf:ro
      - ./lua:/conf/lua:ro
    depends_on:
      postgis: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { memory: 8G, cpus: "4" }
