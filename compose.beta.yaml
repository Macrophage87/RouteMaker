# The private-beta overlay (OWNER-DECISIONS 360-362, FOLLOWUP-BETA-DEPLOY).
#
#   docker compose -f compose.yaml -f compose.beta.yaml --env-file .env <command> <named services>
#
# scripts/beta/beta-compose.sh runs exactly that and refuses a bare `up`, so use it.
#
# What this overlay is for: the owner's shared host (15 GiB RAM, about 8.6 GiB
# free, NO swap, 4 vCPU, nginx already serving other sites on 80/443). RouteMaker
# must never be the reason another site on that host dies, so every container gets
# a hard memory cap: when something spikes, the kernel kills RouteMaker's own
# container (restart: unless-stopped brings it back), not the host's other sites.
#
# What it changes against compose.yaml, and nothing else:
#   * `caddy` and `rebuild` are parked behind the `not-in-beta` profile, so a plain
#     `up` can never start them. scripts/beta/beta-compose.sh refuses to name them under
#     any subcommand; as a backstop, in case one is ever started anyway (compose enables a
#     service's profile when the service is named explicitly), both are capped tiny here,
#     never restart, and caddy publishes no port. nginx is the edge; tiles, database and Photon
#     index are built at home and shipped (scripts/beta/ship-data.sh).
#   * The api alone publishes a port, bound to 127.0.0.1 only; nginx proxies to it.
#     Postgres, Photon and the routers stay on the compose network.
#   * Hard memory caps (deploy.resources.limits.memory, with memswap_limit equal to
#     it so a container cannot borrow swap even if the host grows some), CPU caps, and
#     cpu_shares/oom_score_adj so the host's other sites win contention (below).
#   * Every bind mount of the services the beta runs restated in the long form with
#     `create_host_path: false` (below, "Bind mounts never create their source").
#   * gunicorn at 6 workers, PostgreSQL's shared_buffers sized to its cap, Photon's
#     heap sized to its cap, and WEEKLY_REBUILD_PAUSED=1 (on the parked rebuild too), so that a
#     rebuild worker started here by mistake would only record a pause, never an eight-hour build
#     on a shared host (a hand-fired run_rebuild_now ignores it; the runbook forbids that).
#     It does not stop the weekly tick being queued: with no rebuild worker to take it, one
#     weekly_rebuild job waits on the `rebuild` queue (its queueing lock keeps it to one), and
#     check_operations lists weekly_rebuild as paused (the api and worker carry the setting).
#     Both are expected on the beta
#     (docs/BETA-RUNBOOK.md, "No rebuild runs here").
#
# The budget, against what the local stack measured at idle (docker stats, 2026-10-04):
#
#   service            cap      cpus  measured idle        why this cap
#   postgis            1024M    1.5   0.21 GB              shared_buffers 256M + ~40 backends' work_mem
#                                                          + 64M maintenance (pg_restore) + page cache
#   api                1450M    2.0   0.55 GB at 7 workers 6 workers is about 0.48 GB; the rest is for
#                                                          two route plans and tile draws at once
#   photon             1300M    1.0   1.04 GB at -Xmx1g    heap 896M + direct buffers capped at 192M
#                                                          + ~190M metaspace, code cache, threads, GC
#                                                          = ~1280M; the 0.74 GB index is mmapped page
#                                                          cache, reclaimable
#   valhalla x4         640M    2.0   0.04-0.67 GB each    working set is the mmapped tiles.tar
#                                                          (0.4-0.5 GB) plus 2 workers; mapped file
#                                                          pages are reclaimed, not OOM-killed. 768M
#                                                          until the trail routers came (2026-10-20)
#   valhalla x2 trails  320M    1.0   (new)                valhalla-offroad and valhalla-mtb, 1 worker
#                                                          each; the tiles.tar is paged in as asked
#   worker              512M    0.5   0.07 GB              nightly pg_dump (streamed), sweeps, and the
#                                                          map update's stress-tile pre-draw (`exec worker
#                                                          manage.py predraw_stress_tiles`, a second Django
#                                                          process in this cgroup). 256M until 2026-10-25:
#                                                          the pre-draw was OOM-killed at that cap
#   memcached            24M    0.25  (new) ~20 MiB full     the api workers' shared answer cache
#                                                          (audit S14): -m 16 holds 16 MiB of
#                                                          answers; full, with 2 threads, it
#                                                          measured 20 MiB resident (2026-10-27)
#   migrate (one-shot)  256M    0.5   exits before api starts, not counted as resident
#
#   resident total: 1024 + 1450 + 1300 + 4*640 + 2*320 + 512 + 24 = 7510 MiB = 7.33 GiB,
#   against about 8.6 GiB available, so a spike in every container at once still leaves 1.27 GiB.
#   The startup peak adds the largest one-shot (migrate, 256M): 7766 MiB = 7.58 GiB.
#   The memcached's 24M comes out of the 40 MiB the ceiling left (the owner, 2026-10-27,
#   approving the shared answer cache at about 16 MB).
#   The ceiling is 7.35 GiB since the owner's choice of 2026-10-25 ("Raise ceiling to 7.35 GB"),
#   for the worker's pre-draw; it was 7.1 GiB from
#   the owner's choice of 2026-10-20 ("Both, raise limit to 7.1 GB"), which made room for the
#   two trail routers (it was 7.0 GiB, at 6.94 without them).
#   One-shot management commands go through `exec api ...` (inside the api's own cap) or
#   `run --rm --no-deps migrate ...` (256M), never `run --rm api ...`, which would start a
#   second container with the api's 1450M cap beside the running one.
#
# Concurrency (OWNER-DECISIONS 367.2, "Allow 2 at once"): settings.routing_concurrency is
# workers - 2 - GEOCODE_CONCURRENCY (2), floored at one, and tile_concurrency is
# workers - 1 - routing - geocode, floored at one. At 6 workers that is 2 route plans,
# 2 place searches and 1 stress-tile draw at once, 5 of the 6 workers, which leaves one
# always free for /healthz and sign-in (the invariant production keeps). A third person
# planning at the same instant waits for a slot, up to ~50 s. The checker refuses a
# worker count that leaves no worker free.
#
# Sharing the host (review S7). The CPU caps add up to 13 vCPUs on a 4-vCPU host
# (api 2, postgis 1.5, photon 1, routers 4x2, worker 0.5), so the caps alone do not stop
# RouteMaker taking every core during a burst. Every RouteMaker container therefore also has
#   cpu_shares: 512     half of Docker's default 1024. It only matters under contention:
#                       idle, a container can still use up to its cap; when the host is busy,
#                       the kernel weights each RouteMaker container below the other sites'
#                       (on cgroup v2 Docker maps 512 to cpu.weight 20, against 100 for a
#                       container or service that sets nothing), so the other sites win.
#                       The 13-vCPU cap sum is unchanged; it is a ceiling, not a share.
#   oom_score_adj: 500  if the HOST runs out of memory (no swap) because something else
#                       grew, the kernel's OOM killer prefers a RouteMaker process over
#                       another site's. Our own caps still kill inside our cgroups first.
#
# Bind mounts never create their source. On the server /data is mounted `nofail` and
# Docker's own storage may be on the root disk, so after a reboot Docker can start, and
# restart these containers, before /data is mounted. With compose's short `src:dst` form
# the engine then creates each missing source as an empty directory on the root disk:
# postgis would initdb an empty cluster there and the routers would start with no graph.
# So every bind of every service the beta runs (DATA_ROOT, and the checkout, which is on
# /data too) is restated here in the long form with `bind: { create_host_path: false }`.
# Compose merges volumes by their target, so each entry replaces the base file's. The
# engine then refuses to start a container whose source is missing ("bind source path
# does not exist"), and `beta-compose.sh up -d <services>` once /data is up starts them
# (docs/BETA-RUNBOOK.md, "Reboot"). scripts/check_beta_compose.py refuses a bind without it.

# Every RouteMaker container yields to the host's other sites (header, "Sharing the host").
x-beta-yield: &beta-yield
  cpu_shares: 512
  oom_score_adj: 500

services:
  # --- not in the beta ---------------------------------------------------------
  # Parked, and capped tiny in case one is ever started anyway: the base file gives the
  # rebuild 8G and 4 CPUs, which on this host would OOM other people's sites.
  caddy:
    <<: *beta-yield
    profiles: ["not-in-beta"]
    restart: "no"
    ports: !reset []
    memswap_limit: 64M
    deploy:
      resources:
        limits: { memory: 64M, cpus: "0.1" }
  rebuild:
    <<: *beta-yield
    profiles: ["not-in-beta"]
    restart: "no"
    # The one service that takes rebuild jobs: started anyway, it would take the weekly_rebuild job
    # already waiting on its queue. Paused, that job only records a pause (re-check spec SF1).
    environment:
      WEEKLY_REBUILD_PAUSED: "1"
    memswap_limit: 256M
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.25" }

  # --- the app ----------------------------------------------------------------
  api:
    <<: *beta-yield
    environment:
      # Written here, not read from `.env`, so a stray WEB_CONCURRENCY=7 left in
      # the file cannot undo the memory budget.
      WEB_CONCURRENCY: ${BETA_WEB_CONCURRENCY:-6}
      WEEKLY_REBUILD_PAUSED: "1"
      # The answer cache the six workers share (`memcached` below; core.route_cache). Written
      # here, not read from `.env`: the service is this file's own.
      ROUTE_CACHE_LOCATION: memcached:11211
    # Started with the api, but never a reason the api does not start: a memcached that is
    # missing or down is passed over, and each plan is made as if nothing were kept.
    depends_on:
      memcached: { condition: service_started, required: false }
    # The compose network every service shares, and `routecache`, which only the api and the
    # memcached are on (below, at the end of this file).
    networks: [default, routecache]
    ports:
      - "127.0.0.1:${BETA_API_PORT:-8087}:8000"
    volumes:
      - type: bind
        source: ${DATA_ROOT}/tiles
        target: /data/tiles
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${DATA_ROOT}/static
        target: /data/static
        bind: { create_host_path: false }
      # The base map, read by the link preview's picture (core.preview_basemap).
      - type: bind
        source: ${DATA_ROOT}/basemap
        target: /data/basemap
        read_only: true
        bind: { create_host_path: false }
    memswap_limit: 1450M
    deploy:
      resources:
        limits: { memory: 1450M, cpus: "2" }

  worker:
    <<: *beta-yield
    environment:
      WEEKLY_REBUILD_PAUSED: "1"
      STRESS_PREDRAW_WORKERS: "1"
    volumes:
      - type: bind
        source: ${DATA_ROOT}/backups
        target: /data/backups
        bind: { create_host_path: false }
      - type: bind
        source: ${DATA_ROOT}/tiles
        target: /data/tiles
        read_only: true
        bind: { create_host_path: false }
      # The base map, for the link preview's picture drawn when the link is made
      # (config.procrastinate.draw_share_preview), as the api reads it.
      - type: bind
        source: ${DATA_ROOT}/basemap
        target: /data/basemap
        read_only: true
        bind: { create_host_path: false }
    memswap_limit: 512M
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.5" }

  migrate:
    <<: *beta-yield
    environment:
      WEEKLY_REBUILD_PAUSED: "1"
    memswap_limit: 256M
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.5" }

  # The api workers' shared answer cache (audit S14; the owner, 2026-10-27, signed off a
  # memcached of about 16 MB, as the beta had about 40 MiB to spare). Without it each of the
  # six workers kept its own answers, so whether Undo, a re-open or the Home chip found the
  # answer was left to which worker took the repeat. Memory only (memcached has no disk and
  # logs nothing at this verbosity), so no route is ever written down. -m 16 caps the
  # answers at 16 MiB, least recently used first out; an answer past memcached's 1 MB item
  # limit is not sent (core.route_cache). memcached has no sign-in, so it is on a network of
  # its own that only the api joins (`routecache`, internal: no way out of the host either), not
  # the compose network every other container shares.
  # Down, full or restarted, it costs only the repeats it would have answered.
  memcached:
    <<: *beta-yield
    image: docker.io/library/memcached:1.6.44-alpine@sha256:dfacdbd93e7a6f1ad63801753a1fc959dc678a5a1d2141ff438d57e6d8793fc3
    restart: ${RESTART_POLICY:-unless-stopped}
    # 16 MiB of answers, 2 threads (six workers' gets and sets of a few hundred KB), at most
    # 64 connections (one a worker thread), no UDP.
    command: ["memcached", "-m", "16", "-t", "2", "-c", "64", "-U", "0"]
    networks: [routecache]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    memswap_limit: 24M
    deploy:
      resources:
        limits: { memory: 24M, cpus: "0.25" }

  postgis:
    <<: *beta-yield
    # Pinned by digest to the build home runs (PostgreSQL 16.4, PostGIS 3.4.3): a pull by digest
    # fetches exactly this image and does not move the shared, moving `16-3.4` tag that another
    # stack on the host may use (review r1, N7).
    image: docker.io/postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    # The image's entrypoint passes a command that starts with `postgres` straight
    # through. 256 MB of shared_buffers holds the hot part of `live` (606 MB, mostly
    # the segment table) and all of `public` (105 MB); the rest is the OS cache's.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - random_page_cost=1.1
      # The base file's logging settings, which this command replaces: a failed statement's
      # text and values are never written to the log (compose.yaml, postgis).
      - -c
      - log_min_error_statement=panic
      - -c
      - log_error_verbosity=terse
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=-1
    # Docker's default /dev/shm is 64 MB; parallel queries want more.
    shm_size: 128m
    volumes:
      - type: bind
        source: ${DATA_ROOT}/postgres
        target: /var/lib/postgresql/data
        bind: { create_host_path: false }
    memswap_limit: 1024M
    deploy:
      resources:
        limits: { memory: 1024M, cpus: "1.5" }

  photon:
    <<: *beta-yield
    # The base command, verbatim, with only the JVM flags changed: the heap from
    # -Xms1g -Xmx1g to -Xms512m -Xmx896m, direct buffers capped at 192m (HotSpot's
    # default is the max heap, so heap plus direct buffers could reach 1.75 GB and the
    # cgroup would kill the JVM with no Java error), and ExitOnOutOfMemoryError so a
    # Java OOM exits (and restarts) rather than limping on. tests/test_beta_overlay.py
    # fails if the two ever differ anywhere else, so a change to the base command
    # cannot silently diverge from this.
    # -max-reverse-results 10, not 1: a kind-of-place search ("grocery", "bike shop";
    # core.geocode TAG_SEARCHES) asks /reverse for the nearest few, and 1 capped it to one
    # store (the owner, 2026-10-28, for the Grocery chip). Naming a point still asks for 1.
    command:
      - sh
      - -c
      - |
        if [ ! -d /photon/data/photon_data/node_1 ]; then
          echo "photon: no index at /photon/data/photon_data; import one (docs/DEPLOYMENT.md, Photon)" >&2
          exec sleep infinity
        fi
        exec java -Xms512m -Xmx896m -XX:MaxDirectMemorySize=192m -XX:+ExitOnOutOfMemoryError -jar /photon/photon.jar serve \
          -listen-ip 0.0.0.0 -data-dir /photon/data \
          -max-results 10 -max-reverse-results 10 -query-timeout 3
    volumes:
      - type: bind
        source: ${DATA_ROOT}/photon
        target: /photon/data
        bind: { create_host_path: false }
    memswap_limit: 1300M
    deploy:
      resources:
        limits: { memory: 1300M, cpus: "1" }

  # --- the four routers --------------------------------------------------------
  # Two valhalla workers each, as in compose.yaml: a route and a place-name lookup
  # (which goes to the standard router) must not queue behind each other.
  valhalla-standard:
    <<: *beta-yield
    volumes:
      - type: bind
        source: ${DATA_ROOT}/tiles/standard
        target: /data/tiles/standard
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${DATA_ROOT}/elevation
        target: /data/elevation
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./valhalla
        target: /conf
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./lua
        target: /conf/lua
        read_only: true
        bind: { create_host_path: false }
    memswap_limit: 640M
    deploy:
      resources:
        limits: { memory: 640M, cpus: "2" }
  valhalla-no-trail:
    <<: *beta-yield
    volumes:
      - type: bind
        source: ${DATA_ROOT}/tiles/no-trail
        target: /data/tiles/no-trail
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${DATA_ROOT}/elevation
        target: /data/elevation
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./valhalla
        target: /conf
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./lua
        target: /conf/lua
        read_only: true
        bind: { create_host_path: false }
    memswap_limit: 640M
    deploy:
      resources:
        limits: { memory: 640M, cpus: "2" }
  valhalla-ebike:
    <<: *beta-yield
    volumes:
      - type: bind
        source: ${DATA_ROOT}/tiles/ebike
        target: /data/tiles/ebike
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${DATA_ROOT}/elevation
        target: /data/elevation
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./valhalla
        target: /conf
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./lua
        target: /conf/lua
        read_only: true
        bind: { create_host_path: false }
    memswap_limit: 640M
    deploy:
      resources:
        limits: { memory: 640M, cpus: "2" }
  valhalla-weekend:
    <<: *beta-yield
    volumes:
      - type: bind
        source: ${DATA_ROOT}/tiles/weekend
        target: /data/tiles/weekend
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${DATA_ROOT}/elevation
        target: /data/elevation
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./valhalla
        target: /conf
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./lua
        target: /conf/lua
        read_only: true
        bind: { create_host_path: false }
    memswap_limit: 640M
    deploy:
      resources:
        limits: { memory: 640M, cpus: "2" }

  # --- the off-road router (NO-BIKE, in the rebuild bundle) ----------------------
  # Gravel and Mountain Goat's graph, with green and unrated mountain-bike trails open.
  # Behind the profile `offroad` still, so it starts only when named:
  # scripts/beta/auto-release.sh names it (and valhalla-mtb) once the promoted build is on the
  # host ($RM_DATA/tiles/offroad/current), since a bind with create_host_path: false would stop
  # the whole `up` without it. Until then the api answers Gravel and Mountain Goat on the
  # standard graph. One worker in 320M (the owner's choice of 2026-10-20, "Both, raise limit to
  # 7.1 GB"): a worker is under 100 MiB, the rest is the archive's file pages, reclaimed.
  # By hand, once its tiles are there:
  #   scripts/beta/beta-compose.sh up -d valhalla-offroad valhalla-mtb
  valhalla-offroad:
    <<: *beta-yield
    profiles: ["offroad"]
    restart: ${RESTART_POLICY:-unless-stopped}
    image: ghcr.io/valhalla/valhalla:3.9.1@sha256:4fd114eb1d26b8fc2f43bcb3df234c1b63a0bf13c277405e5943d5361dc575de
    command: ["valhalla_service", "/conf/valhalla-offroad.json", "1"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/tiles/offroad
        target: /data/tiles/offroad
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${DATA_ROOT}/elevation
        target: /data/elevation
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./valhalla
        target: /conf
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./lua
        target: /conf/lua
        read_only: true
        bind: { create_host_path: false }
    memswap_limit: 320M
    deploy:
      resources:
        limits: { memory: 320M, cpus: "1" }

  # The Mountain Bike router (docs/MTB-TOPO-PLAN.md, slice 6): every mountain-bike trail a
  # bicycle may use open. Started as valhalla-offroad is, once $RM_DATA/tiles/mtb/current
  # exists; until then the api answers Mountain Bike on the standard graph and says so.
  # One worker in 320M, as valhalla-offroad.
  valhalla-mtb:
    <<: *beta-yield
    profiles: ["offroad"]
    restart: ${RESTART_POLICY:-unless-stopped}
    image: ghcr.io/valhalla/valhalla:3.9.1@sha256:4fd114eb1d26b8fc2f43bcb3df234c1b63a0bf13c277405e5943d5361dc575de
    command: ["valhalla_service", "/conf/valhalla-mtb.json", "1"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/tiles/mtb
        target: /data/tiles/mtb
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${DATA_ROOT}/elevation
        target: /data/elevation
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./valhalla
        target: /conf
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./lua
        target: /conf/lua
        read_only: true
        bind: { create_host_path: false }
    memswap_limit: 320M
    deploy:
      resources:
        limits: { memory: 320M, cpus: "1" }

# The api's answer cache and the api, and nothing else (memcached, above). `internal`: Docker
# gives it no route out of the host.
networks:
  routecache:
    internal: true
