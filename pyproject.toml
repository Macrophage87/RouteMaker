[project]
name = "routemaker"
version = "0.1.0"
description = "Collaborative bicycle route planning for the Washington, DC metro area"
requires-python = ">=3.11"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The suite runs the production settings through `config.test_settings`, which
# supplies the one secret they refuse to import without (KEY_ENCRYPTION_KEY,
# which keys the ban tombstones) and overrides nothing else. pytest-django sets
# Django up before any conftest body runs, so the default cannot come from
# tests/conftest.py.
DJANGO_SETTINGS_MODULE = "config.test_settings"

[tool.ruff]
line-length = 100
target-version = "py311"
# Migrations are generated. Reformatting them makes the file diverge from what
# makemigrations would write next time, which turns a regeneration into a
# spurious diff and hides a real schema change inside it.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
