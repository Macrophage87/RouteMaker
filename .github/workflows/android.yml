name: Android app

# The phone app (mobile/, v0.8.0). On a pull request that touches mobile/ or this file: `npm test`, the
# Java unit tests and a debug APK (a debug build only; of the secrets it uses only the debug key, and a fork gets none). By hand
# (Actions, "Android app", Run workflow): a debug or a release build. A debug build is debug-signed and
# installs by sideloading; a release build needs the four ROUTEMAKER_KEYSTORE/KEY secrets
# (mobile/README.md). On a release tag (vX.Y.Z) whose app code (mobile/) changed since the tag before:
# the store build, uploaded to Play's internal testing track when the ROUTEMAKER_PLAY_SERVICE_ACCOUNT
# secret is set (scripts/play-upload.sh). Never on any other push. A debug build is signed with ROUTEMAKER_DEBUG_KEYSTORE_BASE64
# when that secret is set, so each test build installs over the last one; that key only ever signs
# debug builds, never a release.
#
# No build carries a site address: this repository is public, and so are its Actions artifacts (any
# signed-in GitHub user can download them), so nothing here may name a server. The app asks for the
# address on first launch and keeps it on the phone. The one exception is the release (store)
# build, by hand or on a tag: it bakes in the ROUTEMAKER_SITE_URL secret (the owner OK'd the address being public there,
# 2026-10-21) and keeps its artifact for 3 days only. site-config.js refuses ROUTEMAKER_URL in CI
# otherwise, and the step after `cap sync` checks that a test build names no site. The store id comes
# from the ROUTEMAKER_APP_ID secret; a debug build adds ".debug" to it, so a test build sits beside
# the store app instead of clashing with it (the two are signed with different keys).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      build:
        description: "debug (sideload to test) or release (signed with the repository secrets)"
        type: choice
        options: [debug, release]
        default: debug
      inspector:
        description: "Allow Chrome's remote inspector (chrome://inspect) in this build"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # On a tag: is there new app code since the tag before? A site-only release needs no new app.
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        run: |
          prev="$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)"
          if [ -z "$prev" ] || ! git diff --quiet "$prev" "$GITHUB_SHA" -- mobile/; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "No app changes since $prev: no new store build."
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  apk:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.changes.outputs.app == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      # A pull request always builds debug, without the inspector; release by hand or on a tag.
      BUILD: ${{ github.event_name == 'push' && 'release' || github.event_name == 'workflow_dispatch' && inputs.build || 'debug' }}
      ROUTEMAKER_VERSION_CODE: ${{ github.run_number }}
      # Never in a store (release) build.
      ROUTEMAKER_DEBUG: ${{ github.event_name == 'workflow_dispatch' && inputs.inspector && inputs.build != 'release' && '1' || '0' }}
      # Empty on a fork's pull request: Gradle then falls back to the placeholder id.
      ROUTEMAKER_APP_ID: ${{ secrets.ROUTEMAKER_APP_ID }}
    steps:
      # Pinned by commit (the tag each pointed to), as ci.yml pins its own; bump deliberately.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No token left in .git for the build's scripts (npm, Gradle and their plugins) to read.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # Capacitor 8's Android build needs JDK 21. The runner image carries the Android SDK (ANDROID_HOME).
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm test
      # Writes the resolved config and the plugin projects into android/; none of it is committed.
      - name: Sync (a test build names no site; the store build bakes in ROUTEMAKER_SITE_URL)
        env:
          STORE_SITE: ${{ env.BUILD == 'release' && github.event_name != 'pull_request' && secrets.ROUTEMAKER_SITE_URL || '' }}
        run: |
          if [ "$BUILD" = release ]; then
            if [ -z "$STORE_SITE" ]; then
              echo "::error::A release (store) build needs the ROUTEMAKER_SITE_URL secret, the site's https origin (mobile/README.md)."
              exit 1
            fi
            ROUTEMAKER_STORE_BUILD=1 ROUTEMAKER_URL="$STORE_SITE" npx cap sync android
          else
            npx cap sync android
          fi
      - name: The store build names its site
        if: env.BUILD == 'release'
        run: |
          node -e '
            const c = require("./android/app/src/main/assets/capacitor.config.json");
            if (!(c.server && c.server.url)) { console.error("::error::The store build names no site."); process.exit(1); }
          '
      - name: No site address in the build
        if: env.BUILD == 'debug'
        run: |
          node -e '
            const c = require("./android/app/src/main/assets/capacitor.config.json");
            if (c.server && c.server.url) { console.error("::error::The config names a site; a CI build must not."); process.exit(1); }
          '
      - name: Java unit tests
        working-directory: mobile/android
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Debug APK
        if: env.BUILD == 'debug'
        working-directory: mobile/android
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ROUTEMAKER_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            # The key lives only in the runner's temporary directory for this job.
            trap 'rm -f "$RUNNER_TEMP/debug.keystore"' EXIT
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/debug.keystore"
            export ROUTEMAKER_DEBUG_KEYSTORE_FILE="$RUNNER_TEMP/debug.keystore"
          else
            echo "::warning::No ROUTEMAKER_DEBUG_KEYSTORE_BASE64 secret: this APK has a fresh debug key and will not install over an earlier test build (mobile/README.md)."
          fi
          ./gradlew --no-daemon assembleDebug
      - name: Release APK and bundle
        if: env.BUILD == 'release' && github.event_name != 'pull_request'
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ROUTEMAKER_KEYSTORE_BASE64 }}
          ROUTEMAKER_KEYSTORE_PASSWORD: ${{ secrets.ROUTEMAKER_KEYSTORE_PASSWORD }}
          ROUTEMAKER_KEY_ALIAS: ${{ secrets.ROUTEMAKER_KEY_ALIAS }}
          ROUTEMAKER_KEY_PASSWORD: ${{ secrets.ROUTEMAKER_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$ROUTEMAKER_KEYSTORE_PASSWORD" ] || [ -z "$ROUTEMAKER_KEY_ALIAS" ] || [ -z "$ROUTEMAKER_KEY_PASSWORD" ]; then
            echo "::error::A release build needs the secrets ROUTEMAKER_KEYSTORE_BASE64, ROUTEMAKER_KEYSTORE_PASSWORD, ROUTEMAKER_KEY_ALIAS and ROUTEMAKER_KEY_PASSWORD (mobile/README.md)."
            exit 1
          fi
          # The key lives only in the runner's temporary directory for this job.
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          ROUTEMAKER_KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew --no-daemon assembleRelease bundleRelease
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Upload to Play internal testing (a release tag only)
        if: github.event_name == 'push'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.ROUTEMAKER_PLAY_SERVICE_ACCOUNT }}
          PLAY_PACKAGE: ${{ secrets.ROUTEMAKER_APP_ID }}
          PLAY_NOTES: "RouteMaker ${{ github.ref_name }}. What's new: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/releases/${{ github.ref_name }}.md"
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::No ROUTEMAKER_PLAY_SERVICE_ACCOUNT secret: the bundle is in this run's artifact; upload it by hand (mobile/README.md)."
            exit 0
          fi
          scripts/play-upload.sh android/app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: routemaker-android-${{ env.BUILD }}-${{ github.run_number }}
          path: |
            mobile/android/app/build/outputs/apk/${{ env.BUILD }}/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          # The store build names the site: kept just long enough to upload to Play.
          retention-days: ${{ env.BUILD == 'release' && 3 || 30 }}
