name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The swap tests exercise ACCESS EXCLUSIVE locking, schema renames and
    # spatial predicates. None of that exists in a substitute engine, so CI runs
    # the real one.
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: routemaker
          POSTGRES_USER: routemaker
          POSTGRES_PASSWORD: routemaker
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: 127.0.0.1
      PGUSER: routemaker
      PGPASSWORD: routemaker
      PGDATABASE: routemaker

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install native dependencies
        # GDAL/PROJ for GeoDjango. LuaJIT for the tag transform: Valhalla 3.5.1
        # requires it (pkg_check_modules(LuaJIT REQUIRED)), and its graph.lua
        # calls bit.bor, which stock Lua 5.2+ does not provide. Testing the
        # transform under lua5.4 would be testing it under an interpreter
        # Valhalla cannot use. GitHub Actions sets CI=true, which turns the
        # suite's missing-interpreter skips into failures, so an image that lost
        # LuaJIT cannot report green with the Lua suites unrun.
        run: sudo apt-get update && sudo apt-get install -y binutils libproj-dev gdal-bin libgeos-dev luajit lua5.4
      - run: pip install -e . -r requirements-dev.txt
      - run: ruff check src tests
      - run: ruff format --check src tests
      # The reference-route assertions are the quality bar's ground truth, not a
      # smoke test: they are what stops a tuning change from silently redefining
      # what a mass ride is.
      - run: pytest -q
      - name: Compose stack rules
        run: python scripts/check_compose_limits.py
