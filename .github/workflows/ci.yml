name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest defusedxml ruff
      - run: ruff check src tests
      - run: ruff format --check src tests
      # The reference-route assertions are the quality bar's ground truth, not a
      # smoke test: they are what stops a tuning change from silently redefining
      # what a mass ride is.
      - run: pytest -q
