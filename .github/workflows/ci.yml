name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The swap tests exercise ACCESS EXCLUSIVE locking, schema renames and
    # spatial predicates. None of that exists in a substitute engine, so CI runs
    # the real one.
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: routemaker
          POSTGRES_USER: routemaker
          POSTGRES_PASSWORD: routemaker
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: 127.0.0.1
      PGUSER: routemaker
      PGPASSWORD: routemaker
      PGDATABASE: routemaker

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native dependencies
        # GDAL/PROJ for GeoDjango; Lua for the tag-transform remap, which is
        # tested in the language the tile build actually loads it in.
        run: sudo apt-get update && sudo apt-get install -y binutils libproj-dev gdal-bin lua5.4
      - run: pip install -e . -r requirements-dev.txt
      - run: ruff check src tests
      - run: ruff format --check src tests
      # The reference-route assertions are the quality bar's ground truth, not a
      # smoke test: they are what stops a tuning change from silently redefining
      # what a mass ride is.
      - run: pytest -q
      - name: Compose stack rules
        run: python scripts/check_compose_limits.py
