name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the tests need the checkout and nothing else.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # The swap tests exercise ACCESS EXCLUSIVE locking, schema renames and
    # spatial predicates. None of that exists in a substitute engine, so CI runs
    # the real one.
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: routemaker
          POSTGRES_USER: routemaker
          POSTGRES_PASSWORD: routemaker
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: 127.0.0.1
      PGUSER: routemaker
      PGPASSWORD: routemaker
      PGDATABASE: routemaker

    steps:
      # Pinned by commit (the tag each pointed to); bump deliberately.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install native dependencies
        # GDAL/PROJ for GeoDjango. LuaJIT for the tag transform: Valhalla 3.5.1
        # requires it (pkg_check_modules(LuaJIT REQUIRED)), and its graph.lua
        # calls bit.bor, which stock Lua 5.2+ does not provide. Testing the
        # transform under lua5.4 would be testing it under an interpreter
        # Valhalla cannot use. GitHub Actions sets CI=true, which turns the
        # suite's missing-interpreter skips into failures, so an image that lost
        # LuaJIT cannot report green with the Lua suites unrun. The backup test
        # runs a real pg_dump against the service container, which needs a
        # client of the server's major version.
        run: sudo apt-get update && sudo apt-get install -y binutils libproj-dev gdal-bin libgeos-dev luajit lua5.4 postgresql-client-16
      # docker/requirements.txt first: it is the exact pin both images build
      # from, and requirements-dev.txt alone resolves newer packages
      # (tests/test_native_environment.py fails when it does). Green here is
      # then evidence about the versions both images share; the per-image
      # extras (gunicorn, shapely) and the pipeline image's Python 3.12 are
      # not checked.
      - run: pip install -e . -r docker/requirements.txt -r requirements-dev.txt
      # The beta checker's bind rule depends on how this Compose renders create_host_path
      # (scripts/check_beta_compose.py, bind_semantics); the version is on record here.
      - name: Tool versions
        continue-on-error: true
        run: (docker compose version; docker version --format '{{.Server.Version}}'; shellcheck --version) || true
      # The front end, from the lockfile: typecheck, test and build. Before
      # pytest because tests/test_frontend.py runs the same node tests and the
      # contrast test reads @protomaps/basemaps from node_modules.
      - name: Front end
        working-directory: frontend
        run: npm ci && npm run typecheck && npm test && npm run build
      # The same tests and build again, the way every beta path runs them: the shared script,
      # in the pinned node image, no network, the source mounted read-only. A test that reads
      # outside frontend/ without a mount for it fails here, not in the middle of a ship.
      - name: Front end, as the beta builds it
        run: |
          docker pull --quiet "$(scripts/beta/frontend-build.sh --print-image)"
          scripts/beta/frontend-build.sh "$PWD" "$PWD/frontend/node_modules" "$RUNNER_TEMP/beta-dist"
      - run: ruff check src tests
      - run: ruff format --check src tests
      # The reference-route assertions are the quality bar's ground truth, not a
      # smoke test: they are what stops a tuning change from silently redefining
      # what a mass ride is.
      - run: pytest -q
      - name: Compose stack rules
        run: python scripts/check_compose_limits.py
