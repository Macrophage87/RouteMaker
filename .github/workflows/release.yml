name: Release

# Runs by itself when a release reaches main (the owner's go to merge is the one approval: the
# owner, 2026-11-28), and by hand from GitHub (Actions, "Release", Run workflow, on main). On the
# push that changes pyproject.toml's version it releases that version, if it is not tagged yet and
# docs/releases/vX.Y.Z.md is in the commit; any other push to main (Dependabot) does nothing.
# It checks the commit and its CI (run on the release branch: ci.yml), then builds the api image
# from that commit in the `release` environment (no required reviewer), publishes it, and makes
# the annotated release tag, which names the image by digest, and carries "ship: code-first"
# when the release pull request has the `code-first` label (or the run's input says so): the
# beta's agent then ships a release held only for lua/ or valhalla/vendor/ without the owner's paste.
# The beta's release agent (scripts/beta/auto-release.sh) deploys the tag, pulling that exact
# image. Nothing here touches the beta. One-time setup: docs/BETA-RUNBOOK.md, "The release
# workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "The release, as vX.Y.Z (docs/releases/vX.Y.Z.md must exist at the commit)"
        required: true
        type: string
      code_first:
        description: "Ship the code now and the map later (a release held only for its map)"
        required: false
        type: boolean
        default: false

# Nothing by default; each job asks for what it needs.
permissions: {}

# One release at a time, and never a run cancelled part-way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
      code_first: ${{ steps.check.outputs.code_first }}
    steps:
      # Pinned by commit (the tag each pointed to); bump deliberately.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: check
        name: Check the version, the commit and its CI
        env:
          VERSION: ${{ inputs.version }}
          CODE_FIRST: ${{ inputs.code_first }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          # The commit this run started at, main's newest: the only one it builds and tags, so the
          # image's provenance (which names the commit the workflow ran at) names the tag's commit.
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$REF" = refs/heads/main ] || { echo "::error::run the release workflow on main, not $REF"; exit 1; }
          git fetch --quiet --tags origin
          if [ "$EVENT" = push ]; then
            # A release is the push that bumps the version (scripts/bump_version.py on the release
            # branch): any other push (Dependabot, a fix, a push after a failed release run) is
            # not, so it never gets tagged as a release the owner's go did not cover.
            version_at() { git show "$1:pyproject.toml" 2>/dev/null | sed -n 's/^version = "\([^"]*\)"$/\1/p' | head -n 1; }
            VERSION=v$(version_at "$COMMIT")
            if [ "$VERSION" = "v$(version_at "$BEFORE")" ] || git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null ||
              ! git cat-file -e "$COMMIT:docs/releases/$VERSION.md" 2>/dev/null; then
              echo "No release in this push ($VERSION: unchanged, tagged already or without notes); a failed release is run by hand." >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # The owner's "code first": the release pull request's `code-first` label.
            [[ $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::pyproject.toml's version $VERSION is not X.Y.Z"; exit 1; }
            labels=$(gh api "repos/$REPO/commits/$COMMIT/pulls?per_page=100" --jq \
              "[.[] | select(.head.ref == \"release/$VERSION\") | .labels[].name] | join(\" \")") ||
              { echo "::warning::could not read the release pull request's labels: no code-first"; labels=""; }
            CODE_FIRST=false
            case " $labels " in *" code-first "*) CODE_FIRST=true ;; esac
          fi
          [[ $VERSION =~ ^v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]] ||
            { echo "::error::the version must be vX.Y.Z (no leading zeros, nothing after)"; exit 1; }
          ! git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null ||
            { echo "::error::$VERSION is already a tag; a tag is never moved: release the next patch version"; exit 1; }
          highest=$(git tag -l 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -n 1 || true)
          if [ -n "$highest" ] && [ "$(printf '%s\n%s\n' "$highest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "::error::$VERSION is not newer than the highest release tag, $highest"; exit 1
          fi
          sha=$COMMIT
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the commit must be a full 40-character id"; exit 1; }
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha is not on main"; exit 1; }
          git cat-file -e "$sha:docs/releases/$VERSION.md" 2>/dev/null ||
            { echo "::error::docs/releases/$VERSION.md is not in $sha: the release notes come first"; exit 1; }
          # The same verdict the beta's agent reads (auto-release.sh, ci_status): `test` and `a11y`
          # green on this commit or, when neither has run there at all, on the head of the one pull request
          # merged as it, if that head has the identical tree (CI runs once, on that pull request).
          verdict=$(gh api "repos/$REPO/commits/$sha/check-runs?filter=latest&per_page=100" |
            python3 scripts/beta/cd_logic.py ci-verdict --sha "$sha" --none)
          if [ "$verdict" = none ]; then
            pr=$(gh api "repos/$REPO/commits/$sha/pulls?per_page=100" |
              python3 scripts/beta/cd_logic.py merged-pr --sha "$sha")
            [ -n "$pr" ] || { echo "::error::no CI on $sha and no one pull request merged as it"; exit 1; }
            read -r num head <<<"$pr"
            git fetch --quiet --no-tags origin "refs/pull/$num/head"
            ours=$(git rev-parse --verify "$sha^{tree}")
            theirs=$(git rev-parse --verify "$head^{tree}")
            [ "$ours" = "$theirs" ] ||
              { echo "::error::no CI on $sha, and pull request #$num's head $head is not the same tree: run CI on main"; exit 1; }
            verdict=$(gh api "repos/$REPO/commits/$head/check-runs?filter=latest&per_page=100" |
              python3 scripts/beta/cd_logic.py ci-verdict --sha "$head")
            echo "CI read from pull request #$num's head $head, the same tree as $sha: $verdict"
          fi
          [ "$verdict" = green ] || { echo "::error::CI on $sha is $verdict, not green (test and a11y)"; exit 1; }
          { echo "sha=$sha"; echo "version=$VERSION"; echo "code_first=${CODE_FIRST:-false}"; } >>"$GITHUB_OUTPUT"
          {
            echo "### $VERSION is ready to release"
            echo "Commit \`$sha\`, CI green; code first: ${CODE_FIRST:-false}. Building the image and making the tag."
          } >>"$GITHUB_STEP_SUMMARY"

  # Runs in the `release` environment (no required reviewer). The only job
  # that can publish a package; it cannot write to the repository.
  image:
    needs: check
    if: needs.check.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      packages: write
      # the build provenance the beta's agent checks before it pulls the image
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - name: Build the api image from the release commit
        env:
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$SHA" ]
          docker build -f docker/api.Dockerfile -t "ghcr.io/macrophage87/routemaker-api:${SHA:0:12}" .
          # It starts and imports its framework (a broken install fails here, not on the beta).
          docker run --rm --network none --entrypoint python "ghcr.io/macrophage87/routemaker-api:${SHA:0:12}" -c "import django; print('django', django.get_version())"
      - id: push
        name: Publish it and read its digest
        env:
          SHA: ${{ needs.check.outputs.sha }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/macrophage87/routemaker-api:${SHA:0:12}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$image"
          docker logout ghcr.io
          digest=$(docker image inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' "$image" | grep '^ghcr.io/macrophage87/routemaker-api@sha256:' | head -n 1)
          [[ $digest =~ ^ghcr\.io/macrophage87/routemaker-api@sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for $image"; exit 1; }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "sha256=${digest#*@}" >>"$GITHUB_OUTPUT"
          echo "Image: \`$digest\`" >>"$GITHUB_STEP_SUMMARY"
      # Build provenance for the digest: names this workflow, its ref (main) and the run. The beta's
      # agent pulls the image only if GitHub holds this attestation (scripts/beta/cd_logic.py,
      # provenance), so an image published any other way is never deployed.
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/macrophage87/routemaker-api
          subject-digest: ${{ steps.push.outputs.sha256 }}
          # Kept by GitHub only: the agent reads it from GitHub's attestations API, and the push step
          # has logged out of ghcr.io (v0.27.2's first run failed "No credentials found for registry").
          push-to-registry: false

  # Runs only after the image job: the annotated tag on the checked commit, naming the
  # image by digest. The beta's agent reads that line (scripts/beta/cd_logic.py, tag-image).
  tag:
    needs: [check, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Make the annotated release tag
        env:
          VERSION: ${{ needs.check.outputs.version }}
          CODE_FIRST: ${{ needs.check.outputs.code_first }}
          SHA: ${{ needs.check.outputs.sha }}
          DIGEST: ${{ needs.image.outputs.digest }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ $DIGEST =~ ^ghcr\.io/macrophage87/routemaker-api@sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad digest"; exit 1; }
          ship=""; [ "$CODE_FIRST" != true ] || ship=$'\nship: code-first\n'
          message=$(printf 'Release %s\n\napi-image: %s\n%s\nMade by the release workflow, from the merge the owner gave the go for: %s\n' "$VERSION" "$DIGEST" "$ship" "$RUN_URL")
          object=$(gh api "repos/$REPO/git/tags" -f tag="$VERSION" -f message="$message" -f object="$SHA" -f type=commit --jq .sha)
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$VERSION" -f sha="$object" >/dev/null
          echo "Tagged \`$VERSION\` on \`$SHA\`. The beta's release agent deploys it on its next pass." >>"$GITHUB_STEP_SUMMARY"
