apply plugin: 'com.android.application'

// RouteMaker (mobile/README.md): the store id, the version and the release key come from the environment,
// so no owner's domain and no key is committed. Without them: a debug-signed build with a placeholder id.
def envOr = { String name, String fallback -> def v = System.getenv(name); (v != null && !v.trim().isEmpty()) ? v.trim() : fallback }
// The version name testers and Play Console see: the site release this app is built with (the repository's
// pyproject.toml), unless ROUTEMAKER_VERSION_NAME says otherwise.
def releaseVersion = {
    def project = rootProject.file("../../pyproject.toml")
    def found = project.exists() ? (project.text =~ /(?m)^version\s*=\s*"([^"]+)"/) : null
    (found != null && found.find()) ? found.group(1) : "0.0.0"
}()
def releaseKeystore = System.getenv("ROUTEMAKER_KEYSTORE_FILE")
// A steady debug key (CI's ROUTEMAKER_DEBUG_KEYSTORE_BASE64 secret), so each test build installs over the last.
// Android's standard debug key passwords and alias; without it, Gradle's own per-machine debug key.
def debugKeystore = System.getenv("ROUTEMAKER_DEBUG_KEYSTORE_FILE")
// Links open in the app (src/links/AndroidManifest.xml): the store build's site, its https origin. Unset
// (every test build), the app takes no tapped links.
def linkSite = envOr("ROUTEMAKER_LINK_SITE", "")
def linkHost = linkSite ? new URI(linkSite).host : ""
if (linkSite && (!linkSite.startsWith("https://") || !linkHost)) throw new GradleException("ROUTEMAKER_LINK_SITE must be the site's https origin")

android {
    namespace = "org.routemaker.phone"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId envOr("ROUTEMAKER_APP_ID", "org.routemaker.phone")
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode envOr("ROUTEMAKER_VERSION_CODE", "1").toInteger()
        versionName envOr("ROUTEMAKER_VERSION_NAME", releaseVersion)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [linkHost: linkHost]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (debugKeystore) {
            debug {
                storeFile file(debugKeystore)
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("ROUTEMAKER_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ROUTEMAKER_KEY_ALIAS")
                keyPassword System.getenv("ROUTEMAKER_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        // A test build sits beside the store app: different keys, so neither could update the other.
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    if (linkHost) {
        sourceSets.release.manifest.srcFile "src/links/AndroidManifest.xml"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // RideCompatPlugin's document-start script (WebViewCompat).
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
